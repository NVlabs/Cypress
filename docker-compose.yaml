services:
  cypress-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: cypress-env:latest
    container_name: cypress_dev_container
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HOME=/root
    user: "0:0"
    volumes:
      - .:/Cypress:Z
    working_dir: /Cypress
    stdin_open: true
    tty: true
    command: /bin/bash
